name: Android release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the signed Android APK as a GitHub release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create React Native environment
        env:
          BRIAN_BACKEND_URL: ${{ vars.BRIAN_BACKEND_URL }}
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          printf 'BRIAN_BACKEND_URL=%s\nMAPBOX_PUBLIC_TOKEN=%s\n' \
            "$BRIAN_BACKEND_URL" "$MAPBOX_PUBLIC_TOKEN" > .env

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create release metadata
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('version.json', 'w', encoding='utf-8') as metadata:
              json.dump({
                  'versionCode': int(os.environ['VERSION_CODE']),
                  'versionName': os.environ['VERSION_NAME'],
                  'apkUrl': os.environ['APK_URL'],
                  'changelog': os.environ.get('GITHUB_SHA', '')[:7],
              }, metadata, indent=2)
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Brian e-Nose v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            version.json
